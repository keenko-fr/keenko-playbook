name: Materialize pinned vendor snapshots

on:
  push:
    branches:
      - gregorybouteiller/kee-2-verify-real-bun-and-vendored-source-pipeline

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Materialize pinned sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run vendor:sync
      - name: Verify before commit
        run: |
          bun run check
          bun run check:release
      - name: Commit snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor
          if git diff --cached --quiet; then
            echo "Vendor snapshots already materialized."
            exit 0
          fi
          git commit -m "chore: materialize pinned vendor sources"
          git push origin "HEAD:${GITHUB_REF_NAME}"
