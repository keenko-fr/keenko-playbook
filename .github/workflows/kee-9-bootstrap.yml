name: KEE-9 Candidate Builder

on:
  pull_request:

permissions:
  contents: write

jobs:
  candidate:
    if: github.head_ref == 'gregorybouteiller/kee-9-define-canonical-formatting-and-linting-toolchain-before-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - run: bun install
      - name: Apply formatter and targeted type-aware fixes
        shell: bash
        run: |
          set -euo pipefail
          bun run format
          git apply --check .kee-9-type-fixes.patch
          git apply .kee-9-type-fixes.patch
          bun run format
          bun run lint:fix || true
          bun run format
      - name: Verify candidate
        run: bun run check
      - name: Create detached candidate commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm .kee-9-type-fixes.patch .github/workflows/kee-9-bootstrap.yml
          mkdir -p .tmp/kee-9
          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          import subprocess
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          api = f"https://api.github.com/repos/{repo}"

          def post(path: str, payload: dict[str, object]) -> dict[str, object]:
              request = urllib.request.Request(
                  api + path,
                  data=json.dumps(payload).encode(),
                  method="POST",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          base_tree = subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip()
          raw_paths = subprocess.check_output(["git", "diff", "--name-only", "-z", "HEAD"])
          paths = [path.decode() for path in raw_paths.split(b"\0") if path]
          entries: list[dict[str, object]] = []
          for path in paths:
              file = Path(path)
              if not file.exists():
                  entries.append({"path": path, "mode": "100644", "type": "blob", "sha": None})
                  continue
              blob = post(
                  "/git/blobs",
                  {"content": base64.b64encode(file.read_bytes()).decode(), "encoding": "base64"},
              )
              staged = subprocess.check_output(["git", "ls-files", "-s", "--", path], text=True).strip()
              mode = staged.split()[0] if staged else "100644"
              entries.append({"path": path, "mode": mode, "type": "blob", "sha": blob["sha"]})

          tree = post("/git/trees", {"base_tree": base_tree, "tree": entries})
          commit = post(
              "/git/commits",
              {
                  "message": "KEE-9 apply canonical formatter and type-aware fixes",
                  "tree": tree["sha"],
                  "parents": [head],
              },
          )
          candidate = str(commit["sha"])
          Path(".tmp/kee-9/candidate-sha.txt").write_text(candidate + "\n")
          Path(".tmp/kee-9/changed-files.txt").write_text("\n".join(paths) + "\n")
          print(f"CANDIDATE_SHA={candidate}")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: kee-9-candidate
          path: .tmp/kee-9
