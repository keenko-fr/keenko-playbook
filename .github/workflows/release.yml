name: Release

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact releasable main commit
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ inputs.expected_sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Verify exact releasable main commit
        run: |
          git fetch origin main --tags
          test "$(git rev-parse HEAD)" = "${{ inputs.expected_sha }}"
          test "$(git rev-parse origin/main)" = "${{ inputs.expected_sha }}"
          git checkout -B main "${{ inputs.expected_sha }}"
          git branch --set-upstream-to=origin/main main
          test "$(git symbolic-ref --short HEAD)" = "main"
          test "$(git rev-parse HEAD)" = "${{ inputs.expected_sha }}"
      - run: bun install --frozen-lockfile
      - name: Release-grade verification
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run check:release
      - name: Configure release identity
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - name: Release with Nx
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
        run: bun x nx release --yes
