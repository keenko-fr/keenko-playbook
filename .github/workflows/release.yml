name: Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Release mode
        required: true
        default: rc
        type: choice
        options:
          - rc
          - stable

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Create Keenko Release token
        id: release-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.KEENKO_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.KEENKO_RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Check out release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          token: ${{ steps.release-app.outputs.token }}

      - name: Verify protected mainline revision
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse refs/remotes/origin/main)" = "$GITHUB_SHA"
          git switch -C main "$GITHUB_SHA"
          git branch --set-upstream-to=origin/main main

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify repository
        run: bun run check

      - name: Verify release plan
        run: bun x nx release plan:check

      - name: Verify packed product before publication
        run: bun run test:product

      - name: Configure release identity
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          RELEASE_APP_SLUG: ${{ steps.release-app.outputs.app-slug }}
        run: |
          release_app_id="$(gh api "/users/${RELEASE_APP_SLUG}[bot]" --jq .id)"
          git config user.name "${RELEASE_APP_SLUG}[bot]"
          git config user.email "${release_app_id}+${RELEASE_APP_SLUG}[bot]@users.noreply.github.com"

      - name: Validate release mode
        env:
          RELEASE_MODE: ${{ inputs.mode }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"

          if [[ "$RELEASE_MODE" == "stable" && "$VERSION" != *-* ]]; then
            echo "Stable release requires the repository to already be on an RC version; got $VERSION"
            exit 1
          fi

          if [[ "$RELEASE_MODE" == "rc" && "$VERSION" == *-* ]]; then
            for plan in .nx/version-plans/*.md; do
              [ -e "$plan" ] || continue

              if ! grep -qE '^__default__: prerelease$' "$plan"; then
                echo "RC continuation requires prerelease version plans; invalid plan: $plan"
                exit 1
              fi
            done
          fi

          if [[ "$RELEASE_MODE" == "rc" && "$VERSION" != *-* ]]; then
            for plan in .nx/version-plans/*.md; do
              [ -e "$plan" ] || continue

              if ! grep -qE '^__default__: pre(patch|minor|major)$' "$plan"; then
                echo "Starting an RC from stable requires a prepatch, preminor, or premajor version plan; invalid plan: $plan"
                exit 1
              fi
            done
          fi

      - name: Read current npm dist-tags
        id: registry-before
        run: |
          latest="$(npm view keenko@latest version)"
          rc="$(npm view keenko@rc version 2>/dev/null || true)"

          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Release with Nx
        env:
          GITHUB_TOKEN: ${{ steps.release-app.outputs.token }}
          RELEASE_MODE: ${{ inputs.mode }}
        run: |
          if [ "$RELEASE_MODE" = "rc" ]; then
            bun x nx release --skip-publish --preid rc

            VERSION="$(node -p "require('./package.json').version")"

            if [[ "$VERSION" != *-rc.* ]]; then
              echo "RC mode produced a non-RC version: $VERSION"
              exit 1
            fi

            bun x nx release publish --tag rc
          else
            VERSION="$(node -p "require('./package.json').version")"
            STABLE_TARGET="${VERSION%%-*}"

            if [[ "$STABLE_TARGET" == "$VERSION" ]]; then
              echo "Stable mode requires an RC version; got $VERSION"
              exit 1
            fi

            bun x nx release "$STABLE_TARGET" --skip-publish
            bun x nx release publish --tag latest
          fi

      - name: Read Nx-published version
        id: published
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Wait for published version to be Bun-installable
        run: bun run release:wait-for-published -- "${{ steps.published.outputs.version }}"

      - name: Verify npm dist-tags
        env:
          RELEASE_MODE: ${{ inputs.mode }}
          PUBLISHED_VERSION: ${{ steps.published.outputs.version }}
          PREVIOUS_LATEST: ${{ steps.registry-before.outputs.latest }}
          PREVIOUS_RC: ${{ steps.registry-before.outputs.rc }}
        run: |
          CURRENT_LATEST="$(npm view keenko@latest version)"
          CURRENT_RC="$(npm view keenko@rc version 2>/dev/null || true)"

          if [ "$RELEASE_MODE" = "rc" ]; then
            test "$CURRENT_RC" = "$PUBLISHED_VERSION"
            test "$CURRENT_LATEST" = "$PREVIOUS_LATEST"
          else
            test "$CURRENT_LATEST" = "$PUBLISHED_VERSION"
            test "$CURRENT_RC" = "$PREVIOUS_RC"
          fi

      - name: Verify published product
        run: bun run test:published -- "${{ steps.published.outputs.version }}"

      - name: Verify published preset selector
        env:
          RELEASE_MODE: ${{ inputs.mode }}
          PUBLISHED_VERSION: ${{ steps.published.outputs.version }}
        run: |
          if [ "$RELEASE_MODE" = "rc" ]; then
            bun run test:published -- "$PUBLISHED_VERSION" "keenko@rc"
          else
            bun run test:published -- "$PUBLISHED_VERSION" "keenko"
          fi
