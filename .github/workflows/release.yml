name: Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Release mode
        required: true
        default: rc
        type: choice
        options:
          - rc
          - stable

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Create Keenko Release token
        id: release-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.KEENKO_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.KEENKO_RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Check out release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          token: ${{ steps.release-app.outputs.token }}

      - name: Verify protected mainline revision
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse refs/remotes/origin/main)" = "$GITHUB_SHA"
          git switch -C main "$GITHUB_SHA"
          git branch --set-upstream-to=origin/main main

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Find equivalent PR verification
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun run tests/ci-verification.ts --reuse

      - name: Verify repository
        if: steps.evidence.outputs.reuse != 'full' && steps.evidence.outputs.reuse != 'guidance'
        run: bun run check

      - name: Verify release plan
        run: bun x nx release plan:check

      - name: Verify packed product before publication
        if: steps.evidence.outputs.reuse != 'full'
        run: bun run test:product

      - name: Configure release identity
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          RELEASE_APP_SLUG: ${{ steps.release-app.outputs.app-slug }}
        run: |
          release_app_id="$(gh api "/users/${RELEASE_APP_SLUG}[bot]" --jq .id)"
          git config user.name "${RELEASE_APP_SLUG}[bot]"
          git config user.email "${release_app_id}+${RELEASE_APP_SLUG}[bot]@users.noreply.github.com"

      - name: Validate release mode
        env:
          RELEASE_MODE: ${{ inputs.mode }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"

          if [[ "$RELEASE_MODE" == "stable" ]] && ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-rc\.(0|[1-9][0-9]*)$ ]]; then
            echo "Stable release requires the repository to already be on an RC version; got $VERSION"
            exit 1
          fi

          if [[ "$RELEASE_MODE" == "rc" && "$VERSION" == *-* ]]; then
            for plan in .nx/version-plans/*.md; do
              [ -e "$plan" ] || continue

              if ! grep -qE '^__default__: prerelease$' "$plan"; then
                echo "RC continuation requires prerelease version plans; invalid plan: $plan"
                exit 1
              fi
            done
          fi

          if [[ "$RELEASE_MODE" == "rc" && "$VERSION" != *-* ]]; then
            for plan in .nx/version-plans/*.md; do
              [ -e "$plan" ] || continue

              if ! grep -qE '^__default__: pre(patch|minor|major)$' "$plan"; then
                echo "Starting an RC from stable requires a prepatch, preminor, or premajor version plan; invalid plan: $plan"
                exit 1
              fi
            done
          fi

      - name: Read current npm dist-tags
        id: registry-before
        run: |
          tags="$(npm view keenko dist-tags --json --registry https://registry.npmjs.org --prefer-online)"
          latest="$(node -p 'JSON.parse(process.argv[1]).latest ?? ""' "$tags")"
          rc="$(node -p 'JSON.parse(process.argv[1]).rc ?? ""' "$tags")"
          test -n "$latest"

          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Revalidate current main before release
        run: |
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse refs/remotes/origin/main)" = "$GITHUB_SHA"
          git diff --exit-code HEAD

      - name: Release with Nx
        env:
          GITHUB_TOKEN: ${{ steps.release-app.outputs.token }}
          RELEASE_MODE: ${{ inputs.mode }}
          PREVIOUS_LATEST: ${{ steps.registry-before.outputs.latest }}
        run: |
          if [ "$RELEASE_MODE" = "rc" ]; then
            bun x nx release --skip-publish --preid rc

            VERSION="$(node -p "require('./package.json').version")"

            if [[ "$VERSION" != *-rc.* ]]; then
              echo "RC mode produced a non-RC version: $VERSION"
              exit 1
            fi

            bun x nx release publish --tag rc
          else
            VERSION="$(node -p "require('./package.json').version")"

            if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-rc\.(0|[1-9][0-9]*)$ ]]; then
              echo "Stable mode requires an RC version; got $VERSION"
              exit 1
            fi
            STABLE_TARGET="${VERSION%%-*}"

            if ! [[ "$PREVIOUS_LATEST" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "Stable mode requires a valid previous npm latest stable version; got $PREVIOUS_LATEST"
              exit 1
            fi

            git rev-parse --verify "refs/tags/v$PREVIOUS_LATEST^{commit}" >/dev/null
            git merge-base --is-ancestor "refs/tags/v$PREVIOUS_LATEST" HEAD

            bun x nx release version "$STABLE_TARGET"
            # Nx 23.2.1 CLI changelogs use current plans, including after RCs consumed them.
            # Override only stable changelog generation; Nx owns all release actions.
            node --input-type=module -e '
              import { ReleaseClient } from "nx/release";
              import { getGitDiff, parseCommits } from "nx/src/command-line/release/utils/git.js";
              import { DEFAULT_CONVENTIONAL_COMMITS_CONFIG } from "nx/src/command-line/release/config/conventional-commits.js";
              const types = Object.fromEntries(
                parseCommits(await getGitDiff(process.argv[2]))
                  .filter(({ type }) => type === "__INVALID__" || !Object.hasOwn(DEFAULT_CONVENTIONAL_COMMITS_CONFIG.types, type))
                  .map(({ type }) => [type, { semverBump: "none", changelog: { title: "Changes", hidden: false } }])
              );
              await new ReleaseClient({
                versionPlans: false,
                changelog: { workspaceChangelog: false },
                conventionalCommits: { types }
              }).releaseChangelog({ version: process.argv[1], from: process.argv[2] });
            ' "$STABLE_TARGET" "v$PREVIOUS_LATEST"
            bun x nx release publish --tag latest
          fi

      - name: Read Nx-published version
        id: published
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Wait for published package and npm dist-tags
        env:
          RELEASE_MODE: ${{ inputs.mode }}
          PUBLISHED_VERSION: ${{ steps.published.outputs.version }}
          PREVIOUS_LATEST: ${{ steps.registry-before.outputs.latest }}
          PREVIOUS_RC: ${{ steps.registry-before.outputs.rc }}
        run: bun run release:wait-for-published -- "$PUBLISHED_VERSION" "$RELEASE_MODE" "$PREVIOUS_LATEST" "$PREVIOUS_RC"

      - name: Verify published product
        run: bun run test:published -- "${{ steps.published.outputs.version }}"

      - name: Verify published preset selector
        env:
          RELEASE_MODE: ${{ inputs.mode }}
          PUBLISHED_VERSION: ${{ steps.published.outputs.version }}
        run: |
          if [ "$RELEASE_MODE" = "rc" ]; then
            bun run tests/wait-for-published.ts --selector "$PUBLISHED_VERSION" rc
          else
            bun run tests/wait-for-published.ts --selector "$PUBLISHED_VERSION" latest
          fi
