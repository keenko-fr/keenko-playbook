name: KEE-14 second pass

on:
  push:
    branches:
      - gregorybouteiller/kee-14-rebuild-keenko-playbook-around-the-nx-based-keenko

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: gregorybouteiller/kee-14-rebuild-keenko-playbook-around-the-nx-based-keenko
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Repair staging-script escaping
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("cli/kee14-second-pass.ts")
          source = path.read_text()
          source = source.replace(r"Read \\`references/upstream/SKILL.md\\`", "Read references/upstream/SKILL.md")
          source = source.replace(
              r'return \`${JSON.stringify(value, null, 2)}\\n\`;',
              r'return \`\${JSON.stringify(value, null, 2)}\\n\`;'
          )
          source = source.replace('branch="release/keenko-v${version}"', r'branch="release/keenko-v\${version}"')
          source = source.replace('"HEAD:refs/heads/${branch}"', r'"HEAD:refs/heads/\${branch}"')
          source = source.replace('"Review and merge ${branch} before running publish from its exact main SHA."', r'"Review and merge \${branch} before running publish from its exact main SHA."')
          source = source.replace('"v${version}"', r'"v\${version}"')
          source = source.replace(
              '    await writeFile(\n      path.join(project, "tests/merge-gate.test.ts"),',
              '    await mkdir(path.join(project, "tests"), { recursive: true });\n    await writeFile(\n      path.join(project, "tests/merge-gate.test.ts"),'
          )
          path.write_text(source)
          PY
      - name: Apply KEE-14 second pass
        run: |
          bun cli/kee14-second-pass.ts
          bun cli/kee14-second-pass.ts --finalize
      - name: Reconcile semantic lint patterns
        run: |
          python - <<'PY'
          from pathlib import Path

          cli = Path("cli/keenko.ts")
          source = cli.read_text()
          source = source.replace(
              '  const spec = target.startsWith("keenko@") ? target : isPlainVersion(target) ? `keenko@${target}` : target;',
              '  let spec = target;\n  if (!target.startsWith("keenko@") && isPlainVersion(target)) {\n    spec = `keenko@${target}`;\n  }'
          )
          source = source.replace(
              '  const pkg = JSON.parse(await readFile(pkgPath, "utf-8")) as { devDependencies: Record<string, string> };',
              '  const pkg = parseObject(await readFile(pkgPath, "utf-8"), pkgPath);\n  const devDependencies = objectOrEmpty(pkg.devDependencies, "package.json.devDependencies");\n  pkg.devDependencies = devDependencies;'
          )
          source = source.replace('pkg.devDependencies.keenko', 'devDependencies.keenko')
          source = source.replace(
              '  const pkg = JSON.parse(await readFile(path.join(root, "node_modules/keenko/package.json"), "utf-8")) as { version: string };\n  return pkg.version;',
              '  const packagePath = path.join(root, "node_modules/keenko/package.json");\n  const pkg = parseObject(await readFile(packagePath, "utf-8"), packagePath);\n  if (typeof pkg.version !== "string") {\n    throw new TypeError(`${packagePath}.version must be a string`);\n  }\n  return pkg.version;'
          )
          source = source.replace('const first = relative.split("/")[0];', 'const [first] = relative.split("/");')
          source = source.replace(
              '    if (typeof manifest.name !== "string") throw new TypeError(`${file}.name must be a string`);',
              '    if (typeof manifest.name !== "string") {\n      throw new TypeError(`${file}.name must be a string`);\n    }'
          )
          source = source.replace(
              '      if (target !== undefined && !allowed[owner]?.has(target)) throw new Error(`Forbidden Keenko workspace dependency: ${owner} -> ${target}`);',
              '      if (target !== undefined && !allowed[owner]?.has(target)) {\n        throw new Error(`Forbidden Keenko workspace dependency: ${owner} -> ${target}`);\n      }'
          )
          source = source.replace(
              '        if (relative === "") return true;',
              '        if (relative === "") {\n          return true;\n        }'
          )
          source = source.replace(
              '        if ([".git", ".nx", "node_modules", "coverage", "dist"].includes(first ?? "")) return false;',
              '        if ([".git", ".nx", "node_modules", "coverage", "dist"].includes(first ?? "")) {\n          return false;\n        }'
          )
          source = source.replace(
              '  if (relative === "apps/web/src/routeTree.gen.ts" || relative.startsWith("apps/web/src/paraglide/")) return true;',
              '  if (relative === "apps/web/src/routeTree.gen.ts" || relative.startsWith("apps/web/src/paraglide/")) {\n    return true;\n  }'
          )
          source = source.replace(
              '  if (relative.startsWith("packages/backend/confect/") && relative !== "packages/backend/confect/.gitkeep") return true;',
              '  if (relative.startsWith("packages/backend/confect/") && relative !== "packages/backend/confect/.gitkeep") {\n    return true;\n  }'
          )
          source = source.replace(
              'async function generatedHashes(root: string) {',
              '// oxlint-disable eslint/no-await-in-loop -- Generated paths are read in stable order before hashing.\nasync function generatedHashes(root: string) {'
          )
          source = source.replace(
              '  return Object.fromEntries(entries.toSorted(([left], [right]) => left.localeCompare(right)));\n}\n\nasync function walkFiles',
              '  return Object.fromEntries(entries.toSorted(([left], [right]) => left.localeCompare(right)));\n}\n// oxlint-enable eslint/no-await-in-loop\n\nasync function walkFiles'
          )
          source = source.replace(
              '    return entry.isDirectory() ? await walkFiles(target) : entry.isFile() ? [target] : [];',
              '    if (entry.isDirectory()) {\n      return await walkFiles(target);\n    }\n    return entry.isFile() ? [target] : [];'
          )
          source = source.replace(
              '  const code = await new Promise<number>((resolve, reject) => {',
              '  // oxlint-disable-next-line promise/avoid-new -- Node child processes expose completion through events.\n  const code = await new Promise<number>((resolve, reject) => {'
          )
          cli.write_text(source)

          migrations = Path("tests/migrations.test.ts")
          source = migrations.read_text()
          old = '    const migrated = JSON.parse(tree.read("package.json", "utf-8") ?? "{}") as { devDependencies: Record<string, string>; projectNote: string; scripts: Record<string, string> };\n    expect(migrated.scripts.check).toBe(current);\n    expect(migrated.scripts["codegen:check"]).toBe("keenko check --guidance --codegen");\n    expect(migrated.scripts.test).toBe("bun test --pass-with-no-tests");\n    expect(migrated.scripts.custom).toBe("keep me");\n    expect(migrated.devDependencies.oxlint).toBe("1.81.0");\n    expect(migrated.projectNote).toBe("preserve me");'
          new = '    const migrated = tree.read("package.json", "utf-8") ?? "";\n    expect(migrated).toContain(current);\n    expect(migrated).toContain("keenko check --guidance --codegen");\n    expect(migrated).toContain("bun test --pass-with-no-tests");\n    expect(migrated).toContain(\'"custom": "keep me"\');\n    expect(migrated).toContain(\'"oxlint": "1.81.0"\');\n    expect(migrated).toContain(\'"projectNote": "preserve me"\');'
          if old not in source:
              raise SystemExit("migration assertion block not found")
          migrations.write_text(source.replace(old, new))

          product = Path("tests/packed-product.test.ts")
          source = product.read_text()
          source = source.replace(
              'import { cp, mkdir, mkdtemp, readFile, rm, stat, writeFile } from "node:fs/promises";',
              'import { cp, mkdir, mkdtemp, readFile, readdir, rm, stat, writeFile } from "node:fs/promises";'
          )
          source = source.replace(
              '    expect((await import("node:fs/promises")).readdir(occupied).then((entries) => entries.toSorted())).resolves.toEqual(["sentinel.txt"]);',
              '    const occupiedEntries = await readdir(occupied);\n    expect(occupiedEntries.toSorted()).toEqual(["sentinel.txt"]);'
          )
          source = source.replace('const first = relative.split("/")[0];', 'const [first] = relative.split("/");')
          source = source.replace('  deleteUndefined(scripts);\n  pkg.scripts = scripts;', '  pkg.scripts = withoutUndefined(scripts);')
          source = source.replace(
              'function record(value: unknown, label: string): Record<string, any> {\n  if (value === null || typeof value !== "object" || Array.isArray(value)) throw new TypeError(`${label} must be an object`);\n  return value as Record<string, any>;\n}',
              'function record(value: unknown, label: string): Record<string, unknown> {\n  if (value === null || typeof value !== "object" || Array.isArray(value)) {\n    throw new TypeError(`${label} must be an object`);\n  }\n  return Object.fromEntries(Object.entries(value));\n}'
          )
          source = source.replace(
              'function deleteUndefined(value: Record<string, any>) {\n  for (const [key, entry] of Object.entries(value)) if (entry === undefined) delete value[key];\n}',
              'function withoutUndefined(value: Record<string, unknown>) {\n  return Object.fromEntries(Object.entries(value).filter(([, entry]) => entry !== undefined));\n}'
          )
          product.write_text(source)
          PY
      - run: bun run format
      - run: bun run lint:fix || true
      - run: bun run format
      - run: bun run lint
      - run: bun run check:release
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: git diff --check
      - name: Commit verified second pass
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "KEE-14: fix packed create and upgrade contracts"
          git push origin HEAD:gregorybouteiller/kee-14-rebuild-keenko-playbook-around-the-nx-based-keenko
