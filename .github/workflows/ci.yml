name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Select verification boundary
        id: route
        env:
          PLAN_BASE: ${{ github.event.pull_request.base.sha }}
          PLAN_HEAD: ${{ github.event.pull_request.head.sha }}
        run: bun run tests/ci-verification.ts

      - name: Record tested tree
        id: revision
        run: |
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "release-tag=$(git describe --tags --match 'v*' --abbrev=0 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify repository
        if: steps.route.outputs.mode != 'docs'
        run: bun run check

      - name: Verify repository documentation
        if: steps.route.outputs.mode == 'docs'
        run: bun run format:check

      - name: Verify release plan
        shell: bash
        env:
          PLAN_BASE: ${{ github.event.pull_request.base.sha }}
          PLAN_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only --no-renames "$(git merge-base "$PLAN_BASE" "$PLAN_HEAD")" "$PLAN_HEAD" -- \
            . \
            ':(top,exclude).github/workflows/ci.yml' \
            ':(top,exclude).github/workflows/release.yml' \
            ':(top,exclude,glob)docs/**/*.md' \
            ':(top,exclude)tests/packed-product.ts' \
            ':(top,exclude)tests/release-version.ts' \
            ':(top,exclude)tests/ci-verification.ts' \
            ':(top,exclude)tests/ci-verification.spec.ts' \
            ':(top,exclude)tests/wait-for-published.ts' \
            ':(top,exclude)tests/wait-for-published.spec.ts' \
            ':(top,exclude)CHANGELOG.md' \
            | bun x nx release plan:check --stdin

      - name: Verify packed product
        if: steps.route.outputs.mode == 'full'
        run: bun run test:product

      - name: Verify packed guidance
        if: steps.route.outputs.mode == 'guidance'
        run: bun run test:product -- --guidance

      - name: Verified ${{ steps.route.outputs.mode }} tree ${{ steps.revision.outputs.tree }} revision ${{ steps.revision.outputs.commit }} release-tag ${{ steps.revision.outputs.release-tag }}
        run: git diff --exit-code HEAD

  minimum-node:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build package
        run: bun run build

      - name: Typecheck repository
        run: bun run typecheck
