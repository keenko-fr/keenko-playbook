name: Bootstrap hardening artifacts

on:
  push:
    branches:
      - gregorybouteiller/kee-2-verify-real-bun-and-vendored-source-pipeline

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Assemble reviewed CLI candidate
        run: |
          cat .bootstrap/playbook.001 .bootstrap/playbook.002 .bootstrap/playbook.003 .bootstrap/playbook.004 .bootstrap/playbook.005 > cli/playbook.ts
          chmod +x cli/playbook.ts
      - run: bun install
      - run: bun run vendor:sync
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: bun run check:release
      - name: Commit deterministic final candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r .bootstrap .github/workflows/bootstrap-hardening.yml
          git add cli/playbook.ts bun.lock vendor
          git commit -m "fix: resolve pre-v1 defect review blockers"
          git push origin "HEAD:${GITHUB_REF_NAME}"
