name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Runtime
        run: bun --revision
      - name: Materialize vendored sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run vendor:sync
      - name: Record vendor snapshot
        run: find vendor -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/vendor-before.sha256
      - name: Verify deterministic vendor sync
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bun run vendor:sync
          find vendor -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/vendor-after.sha256
          diff -u /tmp/vendor-before.sha256 /tmp/vendor-after.sha256
      - name: Release-grade check
        run: bun run check:release
