name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Build safe-fix files
        run: |
          bun run lint:fix || true
          bun run format
          mkdir -p /tmp/kee-9-safe-fix/cli /tmp/kee-9-safe-fix/tests
          cp cli/playbook.ts cli/vendor-sync.ts cli/release.ts /tmp/kee-9-safe-fix/cli/
          cp tests/consumer.test.ts tests/module-graph.test.ts tests/vendor-policy.test.ts tests/release-publish.test.ts /tmp/kee-9-safe-fix/tests/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kee-9-safe-fix-files
          path: /tmp/kee-9-safe-fix
