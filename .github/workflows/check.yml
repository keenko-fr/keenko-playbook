name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Apply historical format fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          migration = Path("src/migrations/native-nx-lifecycle.ts")
          source = migration.read_text()
          source = source.replace(
              '    sortPackageJson: true,\n  });',
              '    sortPackageJson: true,\n    trailingComma: "es5",\n  });',
              1,
          )
          source = source.replace(
              '      const result = await format(file, source, { printWidth: 140, sortImports: true, sortPackageJson: true });',
              '      const result = await format(file, source, { printWidth: 140, sortImports: true, sortPackageJson: true, trailingComma: "es5" });',
              1,
          )
          migration.write_text(source)

          test = Path("tests/packed-upgrade-preservation.test.ts")
          source = test.read_text()
          source = source.replace(
              '  await writeFile(path.join(target, "custom-script.js"), "console.log(\'project-owned\');\\n");',
              '  await writeFile(path.join(target, "custom-script.js"), \'console.log("project-owned");\\n\');',
              1,
          )
          source = source.replace(
              '  run("bun", ["install"], target, registryEnv);\n  run("bun", ["run", "codegen"], target);',
              '  run("bun", ["install"], target, registryEnv);\n  run("bun", ["x", "oxfmt", "packages/feature/package.json"], target);\n  run("bun", ["run", "codegen"], target);',
              1,
          )
          source = source.replace(
              '  expect(await readFile(path.join(root, "custom-script.js"), "utf-8")).toBe("console.log(\'project-owned\');\\n");',
              '  expect(await readFile(path.join(root, "custom-script.js"), "utf-8")).toBe(\'console.log("project-owned");\\n\');',
              1,
          )
          test.write_text(source)
          PY
          bun run format
          git add src/migrations/native-nx-lifecycle.ts tests/packed-upgrade-preservation.test.ts
          git config user.name "Keenko CI historical fix"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "KEE-14 keep historical migration output formatted"
          git push origin HEAD:${{ github.head_ref }}
