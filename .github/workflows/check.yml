name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Finish KEE-9 source migration
        run: |
          python <<'PY'
          from pathlib import Path

          p = Path("cli/vendor-sync.ts")
          s = p.read_text()
          if 'from "node:path"' not in s:
              s = s.replace(
                  'import { mkdir, mkdtemp, readFile, readdir, rename, rm, stat, writeFile } from "node:fs/promises";\n',
                  'import { mkdir, mkdtemp, readFile, readdir, rename, rm, stat, writeFile } from "node:fs/promises";\nimport path from "node:path";\n',
              )
          p.write_text(s)

          p = Path("cli/playbook.ts")
          s = p.read_text()
          s = s.replace(
              '    if (!(await stat(path)).isDirectory()) {\n      throw new Error(`Managed parent must be a directory: ${path}`);\n    }',
              '    const info = await stat(path);\n    if (!info.isDirectory()) {\n      throw new Error(`Managed parent must be a directory: ${path}`);\n    }',
          )
          s = s.replace(
              '    if (!(await stat(path)).isFile()) {\n      throw new Error(`Managed scaffold path must be a file: ${path}`);\n    }',
              '    const info = await stat(path);\n    if (!info.isFile()) {\n      throw new Error(`Managed scaffold path must be a file: ${path}`);\n    }',
          )
          start = s.find('async function findOwnedSkills() {')
          if start != -1:
              end = s.find('\nfunction frontmatterValue', start)
              s = s[:start] + s[end + 1:]
          s = s.replace(
              '    if (!frontmatterValue(text, "name")) {\n      errors.push(`Invalid skill frontmatter: ${nodePath.relative(SOURCE_ROOT, skill)}`);\n    }',
              '    const skillName = frontmatterValue(text, "name");\n    if (skillName === null || skillName.length === 0) {\n      errors.push(`Invalid skill frontmatter: ${nodePath.relative(SOURCE_ROOT, skill)}`);\n    }',
          )
          p.write_text(s)
          PY
          bun run lint:fix || true
          bun run format || true
          git config user.name "keenko-coder"
          git config user.email "actions@users.noreply.github.com"
          git add cli/playbook.ts cli/vendor-sync.ts
          if ! git diff --cached --quiet; then
            git commit -m "KEE-9 finish source lint migration"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
          bun run lint || true
          bun run typecheck || true
