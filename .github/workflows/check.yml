name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Fix packed test lint
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/packed-upgrade-preservation.test.ts")
          source = path.read_text()
          source = source.replace(
              '    child.once("exit", (code) => reject(new Error(`Upgrade registry exited before startup with code ${code ?? 1}`)));',
              '    child.once("exit", (code) => {\n      reject(new Error(`Upgrade registry exited before startup with code ${code ?? 1}`));\n    });',
          )
          source = source.replace(
              '    child.stdout.once("data", (chunk) => resolve(String(chunk).trim()));',
              '    child.stdout.once("data", (chunk) => {\n      resolve(String(chunk).trim());\n    });',
          )
          path.write_text(source)
          PY
          bun run format
          git add tests/packed-upgrade-preservation.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "Keenko CI formatter"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "KEE-14 satisfy historical fixture lint"
          git push origin HEAD:${{ github.head_ref }}
