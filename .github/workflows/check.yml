name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Finalize KEE-9 migration and restore CI
        run: |
          python <<'PY'
          from pathlib import Path

          p = Path("cli/vendor-sync.ts")
          s = p.read_text()
          s = s.replace('import path from "node:path";', 'import nodePath from "node:path";')
          s = s.replace('const { dirname, join, relative, resolve } = path;', 'const { dirname, join, relative, resolve } = nodePath;')
          p.write_text(s)

          Path(".github/workflows/check.yml").write_text('''name: Check

