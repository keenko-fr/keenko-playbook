name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Show safe-fix file contents
        run: |
          bun run lint:fix || true
          bun run format
          for file in cli/playbook.ts cli/vendor-sync.ts cli/release.ts tests/consumer.test.ts tests/module-graph.test.ts tests/vendor-policy.test.ts tests/release-publish.test.ts; do
            echo "BEGIN_BASE64:${file}"
            base64 -w0 "$file"
            echo
            echo "END_BASE64:${file}"
          done
          exit 1
