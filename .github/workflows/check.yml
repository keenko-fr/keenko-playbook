name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Clear synthetic boundary graph cache
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/packed-product.test.ts")
          source = path.read_text()
          old = '    await writeFile(sharedManifestPath, sharedManifestSource);\n\n    const managedGuidance'
          new = '    await writeFile(sharedManifestPath, sharedManifestSource);\n    run("bun", ["x", "nx", "reset"], project, registry.env);\n\n    const managedGuidance'
          if old not in source:
              raise SystemExit("manifest restoration anchor missing")
          path.write_text(source.replace(old, new, 1))
          PY
          bun run format:check
          git add tests/packed-product.test.ts
          git config user.name "Keenko CI boundary fixture"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "KEE-14 reset graph after synthetic boundary failure"
          git push origin HEAD:${{ github.head_ref }}
