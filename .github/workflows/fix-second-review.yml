name: Apply second review fixes

on:
  push:
    branches:
      - gregorybouteiller/kee-2-verify-real-bun-and-vendored-source-pipeline

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: gregorybouteiller/kee-2-verify-real-bun-and-vendored-source-pipeline
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - run: python3 .github/scripts/fix-second-review.py
      - run: bun install --frozen-lockfile
      - name: Canonical verification
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bun run check
          bun run check:release
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: close second review release blockers"
          git push origin HEAD:gregorybouteiller/kee-2-verify-real-bun-and-vendored-source-pipeline
